<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Dumbarwadi Gram Panchayat</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #002868; --primary-dark: #001a4a; --primary-light: #0b3d91;
  --accent: #004c8c; --secondary: #c9a227; --success: #138808; --danger: #dc2626;
  --warning: #f59e0b; --bg-light: #f5f7fb; --bg-white: #ffffff; --text-dark: #0a0f1e;
  --text-gray: #4a5568; --text-light: #8a93a6; --border: #d8e0f0;
  --shadow: 0 4px 20px rgba(0,40,104,0.08);
  --gradient: linear-gradient(135deg, #002868 0%, #0b3d91 100%);
}
body {
  font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
  background: var(--bg-light); color: var(--text-dark); line-height: 1.6; min-height: 100vh;
}
body.lang-mr { font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif; }
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--gradient); padding: 20px;
}
.login-card {
  background: var(--bg-white); border-radius: 16px; padding: 40px;
  width: 100%; max-width: 420px; box-shadow: var(--shadow);
}
.login-card h1 {
  font-size: 1.5rem; color: var(--primary); margin-bottom: 8px; text-align: center;
}
.login-card .subtitle {
  color: var(--text-gray); text-align: center; margin-bottom: 28px; font-size: 0.9rem;
}
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: var(--text-dark);
}
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 0.95rem; font-family: inherit; transition: border-color 0.2s;
  background: var(--bg-white);
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  outline: none; border-color: var(--primary);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 22px; border: none; border-radius: 8px; font-size: 0.95rem;
  font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.2s;
  text-decoration: none;
}
.btn-primary { background: var(--gradient); color: white; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,40,104,0.25); }
.btn-success { background: var(--success); color: white; }
.btn-success:hover { background: #106e06; }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #b91c1c; }
.btn-secondary { background: var(--text-gray); color: white; }
.btn-secondary:hover { background: #2d3748; }
.btn-sm { padding: 6px 14px; font-size: 0.8rem; }
.btn-block { width: 100%; }
.error-box {
  background: #fee2e2; color: var(--danger); padding: 10px 14px; border-radius: 8px;
  margin-bottom: 16px; font-size: 0.88rem;
}
.admin-layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
.sidebar {
  background: var(--gradient); color: white; padding: 24px 0; position: sticky; top: 0;
  height: 100vh; overflow-y: auto;
}
.sidebar-brand {
  padding: 0 24px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 16px;
}
.sidebar-brand h2 { font-size: 1.1rem; font-weight: 600; }
.sidebar-brand p { font-size: 0.78rem; opacity: 0.8; margin-top: 4px; }
.nav-item {
  padding: 11px 24px; cursor: pointer; display: flex; align-items: center; gap: 10px;
  font-size: 0.9rem; transition: background 0.2s; border-left: 3px solid transparent;
}
.nav-item:hover { background: rgba(255,255,255,0.08); }
.nav-item.active { background: rgba(255,255,255,0.12); border-left-color: var(--secondary); }
.nav-icon { width: 18px; height: 18px; opacity: 0.9; }
.sidebar-footer {
  padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: auto;
  position: absolute; bottom: 0; left: 0; right: 0;
}
.sidebar-footer .user-info { font-size: 0.82rem; margin-bottom: 10px; opacity: 0.9; }
.main { padding: 28px 36px; overflow-y: auto; }
.page-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;
  flex-wrap: wrap; gap: 12px;
}
.page-header h1 { font-size: 1.6rem; color: var(--primary); }
.lang-toggle {
  display: flex; gap: 6px; background: white; padding: 4px; border-radius: 8px;
  border: 1px solid var(--border);
}
.lang-toggle button {
  padding: 6px 14px; border: none; background: transparent; cursor: pointer;
  border-radius: 6px; font-size: 0.82rem; font-family: inherit; font-weight: 500;
  color: var(--text-gray);
}
.lang-toggle button.active { background: var(--primary); color: white; }
.toolbar {
  display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
}
.toolbar input[type="search"] {
  flex: 1; min-width: 200px; padding: 9px 14px; border: 1.5px solid var(--border);
  border-radius: 8px; font-family: inherit; font-size: 0.9rem;
}
.toolbar select {
  padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 8px;
  font-family: inherit; font-size: 0.9rem;
}
.data-table {
  width: 100%; border-collapse: collapse; background: white; border-radius: 12px;
  overflow: hidden; box-shadow: var(--shadow);
}
.data-table th {
  background: var(--primary); color: white; padding: 12px 16px; text-align: left;
  font-size: 0.82rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
}
.data-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: #f9fafc; }
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-light);
}
.empty-state p { margin-top: 10px; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
  align-items: center; justify-content: center; z-index: 1000; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: white; border-radius: 14px; width: 100%; max-width: 640px; max-height: 90vh;
  overflow-y: auto; box-shadow: var(--shadow);
}
.modal-header {
  padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex;
  align-items: center; justify-content: space-between;
}
.modal-header h2 { font-size: 1.15rem; color: var(--primary); }
.modal-close {
  background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-gray);
  line-height: 1;
}
.modal-body { padding: 20px 24px; }
.modal-footer {
  padding: 16px 24px; border-top: 1px solid var(--border); display: flex;
  justify-content: flex-end; gap: 10px;
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 768px) {
  .form-row { grid-template-columns: 1fr; }
  .admin-layout { grid-template-columns: 1fr; }
  .sidebar { position: relative; height: auto; }
  .sidebar-footer { position: relative; }
  .main { padding: 20px; }
}
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem;
  font-weight: 500;
}
.badge-pending { background: #fef3c7; color: #92400e; }
.badge-approved { background: #d1fae5; color: #065f46; }
.badge-rejected { background: #fee2e2; color: #991b1b; }
.badge-info { background: #dbeafe; color: #1e40af; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
.stat-card {
  background: white; border-radius: 12px; padding: 20px; box-shadow: var(--shadow);
}
.stat-card .label { font-size: 0.82rem; color: var(--text-gray); margin-bottom: 6px; }
.stat-card .value { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
.stat-card .trend { font-size: 0.78rem; color: var(--success); margin-top: 4px; }
.actions-cell { display: flex; gap: 6px; }
.detail-section { margin-bottom: 18px; }
.detail-section h3 { font-size: 0.95rem; color: var(--primary); margin-bottom: 8px; font-weight: 600; }
.detail-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.88rem; }
.detail-item .k { color: var(--text-gray); }
.detail-item .v { color: var(--text-dark); font-weight: 500; }
.hidden { display: none !important; }
.loader {
  display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border);
  border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.toast {
  position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px;
  color: white; font-weight: 500; z-index: 2000; animation: slideIn 0.3s;
}
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
.toast-info { background: var(--primary); }
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
</style>
</head>

<script>
const API_BASE = '/api/admin';
let csrfToken = '';
let currentLang = 'en';

async function api(url, opts = {}) {
  if (!csrfToken) {
    const r = await fetch('/api/csrf-token');
    csrfToken = (await r.json()).token;
  }
  const headers = {
    'Content-Type': 'application/json',
    'X-CSRF-Token': csrfToken,
    ...(opts.headers || {}),
  };
  const res = await fetch(url, { ...opts, headers, credentials: 'same-origin' });
  if (res.status === 401) { showLogin(); throw new Error('Unauthorized'); }
  let data; try { data = await res.json(); } catch(e) { data = null; }
  if (!res.ok) throw new Error(data?.error || 'Request failed');
  return data;
}

function t(en, mr) { return currentLang === 'mr' ? mr : en; }

function applyLang() {
  document.querySelectorAll('[data-en]').forEach(el => {
    const txt = el.getAttribute(currentLang === 'mr' ? 'data-mr' : 'data-en');
    if (txt) el.textContent = txt;
  });
  document.body.classList.toggle('lang-mr', currentLang === 'mr');
}

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function showModal(title, bodyHTML, footerHTML = '') {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHTML;
  document.getElementById('modalFooter').innerHTML = footerHTML;
  document.getElementById('modal').classList.add('show');
}
function hideModal() { document.getElementById('modal').classList.remove('show'); }
document.getElementById('modalClose').onclick = hideModal;
document.getElementById('modal').onclick = (e) => { if (e.target.id === 'modal') hideModal(); };

function showLogin() {
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('adminView').classList.add('hidden');
  applyLang();
}

async function showAdmin() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('adminView').classList.remove('hidden');
  try {
    const me = await api('/api/admin/me');
    document.getElementById('userInfo').textContent = me.username || 'admin';
  } catch(e) {}
  applyLang();
  loadView('dashboard');
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  try {
    await api('/api/admin/login', {
      method: 'POST',
      body: JSON.stringify({
        username: document.getElementById('loginUsername').value,
        password: document.getElementById('loginPassword').value,
      }),
    });
    toast(t('Signed in successfully', 'यशस्वीरित्या साइन इन'), 'success');
    showAdmin();
  } catch(e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
  }
});

document.getElementById('logoutBtn').onclick = async () => {
  try { await api('/api/admin/logout', { method: 'POST' }); } catch(e) {}
  csrfToken = '';
  showLogin();
};

document.getElementById('btnEn').onclick = () => {
  currentLang = 'en';
  document.getElementById('btnEn').classList.add('active');
  document.getElementById('btnMr').classList.remove('active');

async function renderCrud(route, label, requiredFields, allFields, typeHints = {}) {
  const viewId = 'view' + label.replace(/[^a-zA-Z]/g, '') + 's';
  let containerId = Object.entries({
    'schemes':'viewSchemes','notices':'viewNotices','services':'viewServices',
    'panchayat-members':'viewMembers','projects':'viewProjects',
    'gram-sabha-meetings':'viewGramsabha','contacts':'viewContacts'
  }).find(([k]) => k === route)?.[1];
  if (!containerId) return;
  const el = document.getElementById(containerId);
  el.classList.remove('hidden');
  el.innerHTML = '<div style="text-align:center;padding:40px"><div class="loader"></div></div>';

  try {
    const res = await api(`${API_BASE}/${route}`);
    const rows = res.data || [];
    const listFields = allFields.slice(0, 4);
    const toolbar = `
      <div class="toolbar">
        <input type="search" id="search-${route}" placeholder="${t('Search...','शोधा...')}">
        <button class="btn btn-primary btn-sm" id="add-${route}">+ ${t('Add New','नवीन जोडा')} ${label}</button>
      </div>
    `;
    let tableHTML = rows.length ? `
      <table class="data-table">
        <thead><tr>${listFields.map(f => `<th>${f}</th>`).join('')}<th style="width:160px">${t('Actions','क्रिया')}</th></tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              ${listFields.map(f => `<td>${r[f] || ''}</td>`).join('')}
              <td class="actions-cell">
                <button class="btn btn-sm btn-secondary" onclick="editItem('${route}','${label}',${r.id},${JSON.stringify(requiredFields)},${JSON.stringify(allFields)},${JSON.stringify(typeHints)})">${t('Edit','संपादित')}</button>
                <button class="btn btn-sm btn-danger" onclick="deleteItem('${route}','${label}',${r.id})">${t('Delete','हटवा')}</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    ` : `<div class="empty-state" style="background:white;border-radius:12px;box-shadow:var(--shadow)"><h3>${t('No items yet','अद्याप आयटम नाहीत')}</h3><p>${t('Click "Add New" to create one','नवीन जोडा क्लिक करा')}</p></div>`;

    el.innerHTML = toolbar + tableHTML;
    document.getElementById(`add-${route}`).onclick = () => editItem(route, label, null, requiredFields, allFields, typeHints);
    const sinput = document.getElementById(`search-${route}`);
    sinput.oninput = () => {
      const q = sinput.value.toLowerCase();
      el.querySelectorAll('tbody tr').forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    };
  } catch(e) {
    el.innerHTML = `<div style="color:var(--danger);text-align:center;padding:40px">${e.message}</div>`;
  }
}

window.editItem = async function(route, label, id, requiredFields, allFields, typeHints) {
  let existing = {};
  if (id) {
    try {
      const res = await api(`${API_BASE}/${route}`);
      existing = (res.data || []).find(r => r.id === id) || {};
    } catch(e) {}
  }
  const title = (id ? t('Edit','संपादित') : t('Add New','नवीन जोडा')) + ' ' + label;
  const body = `
    <form id="itemForm">
      ${allFields.map(f => {
        const type = typeHints[f] || 'text';
        const inputType = type === 'number' ? 'number' : (type.includes('desc') || type.includes('process') || type.includes('benefits') || type.includes('eligibility') || type.includes('documents') || type.includes('minutes') || type.includes('description') ? 'textarea' : 'text');
        const isRequired = requiredFields.includes(f);
        return `
          <div class="form-group">
            <label>${f}${isRequired ? ' *' : ''}</label>
            ${inputType === 'textarea'
              ? `<textarea name="${f}" rows="3" ${isRequired?'required':''}>${existing[f] || ''}</textarea>`
              : `<input type="${inputType}" name="${f}" value="${existing[f] ?? ''}" ${isRequired?'required':''} ${type==='number'?'step="any"':''}>`
            }
          </div>
        `;
      }).join('')}
    </form>
  `;
  const footer = `
    <button class="btn btn-secondary" onclick="hideModal()">${t('Cancel','रद्द करा')}</button>
    <button class="btn btn-primary" onclick="submitItem('${route}',${id})">${id ? t('Save Changes','बदल जतन करा') : t('Create','तयार करा')}</button>
  `;
  showModal(title, body, footer);
};

window.submitItem = async function(route, id) {
  const form = document.getElementById('itemForm');
  const fd = new FormData(form);
  const body = {};
  for (const [k, v] of fd.entries()) body[k] = v === '' ? null : v;
  try {
    if (id) {
      await api(`${API_BASE}/${route}/${id}`, { method: 'PUT', body: JSON.stringify(body) });
      toast(t('Updated successfully', 'यशस्वीरित्या अपडेट'), 'success');
    } else {
      await api(`${API_BASE}/${route}`, { method: 'POST', body: JSON.stringify(body) });
      toast(t('Created successfully', 'यशस्वीरित्या तयार'), 'success');
    }
    hideModal();
    const cur = document.querySelector('.nav-item.active').dataset.view;
    loadView(cur);
  } catch(e) {
    toast(e.message, 'error');
  }
};

window.deleteItem = async function(route, label, id) {
  if (!confirm(t(`Delete this ${label}?`, `हा ${label} हटवायचा?`))) return;
  try {
    await api(`${API_BASE}/${route}/${id}`, { method: 'DELETE' });
    toast(t('Deleted successfully', 'यशस्वीरित्या हटवले'), 'success');
    const cur = document.querySelector('.nav-item.active').dataset.view;
    loadView(cur);
  } catch(e) {
    toast(e.message, 'error');
  }
};

window.updateServiceAppStatus = async function(id) {
  const s = document.getElementById('sva-status').value;
  const note = document.getElementById('sva-note').value;
  if (!s && !note) { toast(t('Select status or add note','स्थिती निवडा किंवा टीप जोडा'),'error'); return; }
  try {
    await api(`${API_BASE}/service-applications/${id}`, {
      method: 'PATCH',
      body: JSON.stringify({ status: s || undefined, admin_note: note }),
    });
    toast(t('Updated','अपडेट'), 'success');
    hideModal();
    loadView('service-applications');
  } catch(e) { toast(e.message,'error'); }
};

async function renderComplaints() {
  const el = document.getElementById('viewComplaints');
  el.classList.remove('hidden');
  el.innerHTML = '<div style="text-align:center;padding:40px"><div class="loader"></div></div>';
  try {
    const res = await api(`${API_BASE}/complaints`);
    const rows = res.data || [];
    el.innerHTML = `
      <div class="toolbar">
        <input type="search" id="c-search" placeholder="${t('Search','शोधा')}">
        <select id="c-status">
          <option value="">${t('All Statuses','सर्व स्थिती')}</option>
          <option>open</option><option>in-progress</option><option>resolved</option><option>closed</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('c-search').value='';document.getElementById('c-status').value='';loadView('complaints')">${t('Reset','रीसेट')}</button>
      </div>
      <table class="data-table">
        <thead><tr>
          <th>${t('ID','ओळख')}</th>
          <th>${t('Type','प्रकार')}</th>
          <th>${t('Complaint','तक्रार')}</th>
          <th>${t('Ward','वॉर्ड')}</th>
          <th>${t('Status','स्थिती')}</th>
          <th>${t('Date','तारीख')}</th>
          <th style="width:160px">${t('Actions','क्रिया')}</th>
        </tr></thead>
        <tbody>
          ${rows.length ? rows.map(c => `
            <tr>
              <td>${c.id}</td>
              <td>${c.complaint_type||''}</td>
              <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.description_en||c.description_mr||''}</td>
              <td>${c.location_ward||'-'}</td>
              <td><span class="badge badge-${c.status==='resolved'||c.status==='closed'?'approved':'pending'}">${c.status||'open'}</span></td>
              <td>${new Date(c.created_at).toLocaleDateString()}</td>
              <td class="actions-cell">
                <button class="btn btn-sm btn-secondary" onclick="viewComplaint('${c.id}')">${t('View','पहा')}</button>
              </td>
            </tr>
          `).join('') : `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-light)">${t('No complaints','तक्रारी नाहीत')}</td></tr>`}
        </tbody>
      </table>
    `;
    const filter = () => {
      const q = document.getElementById('c-search').value.toLowerCase();
      const s = document.getElementById('c-status').value;
      el.querySelectorAll('tbody tr').forEach(tr => {
        const txt = tr.textContent.toLowerCase();
        const st = tr.querySelector('.badge').textContent.trim();
        const ok1 = !q || txt.includes(q);
        const ok2 = !s || st === s;
        tr.style.display = ok1 && ok2 ? '' : 'none';
      });
    };
    document.getElementById('c-search').oninput = filter;
    document.getElementById('c-status').onchange = filter;
  } catch(e) {
    el.innerHTML = `<div style="color:var(--danger);text-align:center;padding:40px">${e.message}</div>`;
  }
}

window.viewComplaint = async function(id) {
  try {
    const res = await api(`${API_BASE}/complaints`);
    const c = (res.data || []).find(r => r.id === id);
    if (!c) return;
    const body = `
      <div class="detail-section">
        <h3>${t('Complaint','तक्रार')}</h3>
        ${['id','complaint_type','complainant_name','mobile','location_ward','status','responsible_officer','created_at'].map(f => {
          let v = c[f]; if (f === 'created_at' && v) v = new Date(v).toLocaleString();
          return `<div class="detail-item"><span class="k">${f}</span><span class="v">${v||'-'}</span></div>`;
        }).join('')}
      </div>
      <div class="detail-section">
        <h3>${t('Description','वर्णन')}</h3>
        <p style="font-size:0.9rem;padding:10px;background:var(--bg-light);border-radius:8px">${c.description_en||c.description_mr||'-'}</p>
        ${c.admin_note ? `<p style="font-size:0.85rem;padding:10px;background:#fff7ed;border-radius:8px;margin-top:8px"><strong>${t('Admin Note:','प्रशासक टीप:')}</strong> ${c.admin_note}</p>` : ''}
      </div>
      ${c.replies && c.replies.length ? `
      <div class="detail-section">
        <h3>${t('Replies','उत्तरे')}</h3>
        ${c.replies.map(r => `<div style="padding:8px;border-bottom:1px solid var(--border);font-size:0.85rem"><strong>${r.by}</strong> (${new Date(r.ts).toLocaleString()})<br>${r.text||''}${r.photo?`<br><img src="${r.photo}" style="max-width:200px;margin-top:6px;border-radius:6px">`:''}</div>`).join('')}
      </div>` : ''}
      <div class="form-row">
        <div class="form-group">
          <label>${t('Status','स्थिती')}</label>
          <select id="c-status-f">
            <option value="">--</option>
            <option>open</option><option>in-progress</option><option>resolved</option><option>closed</option>
          </select>
        </div>
        <div class="form-group">
          <label>${t('Officer','अधिकारी')}</label>
          <input type="text" id="c-officer" value="${c.responsible_officer||''}">
        </div>
      </div>
      <div class="form-group">
        <label>${t('Admin Reply','प्रशासक उत्तर')}</label>
        <textarea id="c-reply" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>${t('Admin Note','प्रशासक टीप')}</label>
        <textarea id="c-note" rows="2">${c.admin_note||''}</textarea>
      </div>
    `;
    const footer = `
      <button class="btn btn-secondary" onclick="hideModal()">${t('Close','बंद करा')}</button>
      <button class="btn btn-primary" onclick="updateComplaint('${c.id}')">${t('Save','जतन करा')}</button>
    `;
    showModal(t('Complaint #','तक्रार #') + c.id, body, footer);
  } catch(e) { toast(e.message,'error'); }
};

window.updateComplaint = async function(id) {
  const payload = {};
  const s = document.getElementById('c-status-f').value;
  const r = document.getElementById('c-reply').value;
  const o = document.getElementById('c-officer').value;
  const n = document.getElementById('c-note').value;
  if (s) payload.status = s;
  if (r) payload.admin_reply_text = r;
  if (o) payload.responsible_officer = o;
  if (n) payload.admin_note = n;
  if (!Object.keys(payload).length) { toast(t('Nothing to update','अपडेट करण्यासारखे काही नाही'),'error'); return; }
  try {
    await api(`${API_BASE}/complaints/${id}`, { method: 'PATCH', body: JSON.stringify(payload) });
    toast(t('Updated','अपडेट'), 'success');
    hideModal();
    loadView('complaints');
  } catch(e) { toast(e.message,'error'); }
};

window.replyMessage = async function(id) {
  try {
    const res = await api(`${API_BASE}/contact-messages`);
    const m = (res.data || []).find(r => r.id === id);
    if (!m) return;
    const body = `
      <div class="detail-section">
        <h3>${t('From','प्रेषक')}: ${m.name} &lt;${m.email}&gt;</h3>
        <p style="font-size:0.9rem"><strong>${t('Subject:','विषय:')}</strong> ${m.subject||''}</p>
        <p style="padding:12px;background:var(--bg-light);border-radius:8px;font-size:0.88rem;margin-top:8px">${m.message||''}</p>
        ${m.admin_reply ? `<p style="padding:12px;background:#d1fae5;border-radius:8px;font-size:0.88rem;margin-top:8px"><strong>${t('Previous reply','मागील उत्तर')}:</strong><br>${m.admin_reply}</p>` : ''}
      </div>
      <div class="form-group">
        <label>${t('Your Reply','तुमचे उत्तर')} *</label>
        <textarea id="m-reply" rows="4" required></textarea>
      </div>
    `;
    const footer = `
      <button class="btn btn-secondary" onclick="hideModal()">${t('Close','बंद करा')}</button>
      <button class="btn btn-primary" onclick="sendReply(${m.id})">${t('Send Reply','उत्तर पाठवा')}</button>
    `;
    showModal(t('Reply to Message','संदेशाला उत्तर द्या'), body, footer);
  } catch(e) { toast(e.message,'error'); }
};

window.sendReply = async function(id) {
  const r = document.getElementById('m-reply').value.trim();
  if (!r) { toast(t('Reply required','उत्तर आवश्यक'),'error'); return; }
  try {
    await api(`${API_BASE}/contact-messages/${id}/reply`, {
      method: 'PATCH',
      body: JSON.stringify({ admin_reply: r }),
    });
    toast(t('Reply sent','उत्तर पाठवले'), 'success');
    hideModal();
    loadView('contact-messages');
  } catch(e) { toast(e.message,'error'); }
};
